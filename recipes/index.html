<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes — Obermiller Family</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #667eea; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            line-height: 1.5;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            transition: max-width 0.2s;
        }
        .container.wide {
            max-width: 1200px;
        }

        .header {
            padding: 24px 0 16px;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 16px;
        }
        .back-link:hover { text-decoration: underline; }

        h1 {
            font-size: 2.25rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px 24px;
            margin: 16px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 32px 0 12px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }

        ul.recipe-list {
            list-style: none;
            padding: 0;
        }

        ul.recipe-list li {
            margin: 6px 0;
        }

        a.recipe-link {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 300;
        }
        a.recipe-link:hover { text-decoration: underline; }

        .description {
            font-style: italic;
            color: rgba(255, 255, 255, 0.9);
            margin: 12px 0;
        }

        .meta {
            color: rgba(255, 255, 255, 0.85);
            margin: 8px 0;
            font-size: 0.95rem;
        }

        h2 {
            font-size: 1.5rem;
            margin: 28px 0 12px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }

        h3 {
            font-size: 1.15rem;
            margin: 16px 0 8px;
        }

        ol.directions, ul.notes {
            margin-left: 24px;
        }

        ol.directions li { margin: 12px 0; }
        ul.notes li { margin: 6px 0; }

        ul.ingredients {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        ul.ingredients li {
            margin: 2px 0;
        }
        .ingredient-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .ingredient-label:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .ingredient-label input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: #fff;
            flex-shrink: 0;
            cursor: pointer;
        }
        .ingredient-label input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            opacity: 0.55;
        }
        .ingredient-label span {
            flex: 1;
            line-height: 1.4;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
            gap: 32px;
            margin-top: 24px;
        }

        .col-ingredients {
            align-self: start;
        }

        @media (min-width: 901px) {
            .col-ingredients {
                position: sticky;
                top: 20px;
            }
        }

        @media (max-width: 900px) {
            .recipe-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .scale-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 12px 0 16px;
            flex-wrap: wrap;
        }

        .scale-label { font-weight: 500; }

        .scale-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .scale-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .scale-btn.active {
            background: #fff;
            color: #5a4a9a;
            font-weight: 600;
        }

        .source { margin-top: 24px; color: rgba(255, 255, 255, 0.85); }
        .source a { color: #fff; }

        .recipe-image {
            width: 100%;
            max-width: 600px;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin: 16px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .loading { padding: 40px 0; text-align: center; color: rgba(255, 255, 255, 0.8); }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="header">
            <a id="back-link" href="/" class="back-link">← Home</a>
            <h1 id="page-title">Recipes</h1>
            <p class="subtitle" id="page-subtitle"></p>
        </div>
        <div id="content" class="loading">Loading…</div>
    </div>

    <script>
    // ===== Recipe ingredient scaling (ported from ianobermiller.com) =====
    const UNICODE_FRACTIONS = {
        '¼':'1/4','½':'1/2','¾':'3/4','⅐':'1/7','⅑':'1/9','⅒':'1/10',
        '⅓':'1/3','⅔':'2/3','⅕':'1/5','⅖':'2/5','⅗':'3/5','⅘':'4/5',
        '⅙':'1/6','⅚':'5/6','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'
    };

    function decimalToMixedNumber(decimal) {
        if (decimal === 0) return '0';
        const whole = Math.floor(decimal);
        const fraction = decimal - whole;
        if (fraction < 0.01) return whole.toString();
        const fractionMap = [[0.125,'1/8'],[0.25,'1/4'],[0.333,'1/3'],[0.5,'1/2'],[0.667,'2/3'],[0.75,'3/4']];
        let closest = '', minDiff = Infinity;
        for (const [v, s] of fractionMap) {
            const d = Math.abs(fraction - v);
            if (d < minDiff) { minDiff = d; closest = s; }
        }
        if (minDiff < 0.02) return whole > 0 ? whole + ' ' + closest : closest;
        return decimal.toFixed(2).replace(/\.?0+$/, '');
    }

    function scaleIngredient(ingredient, scale) {
        if (scale === 1) return ingredient;
        let result = ingredient;
        for (const [u, a] of Object.entries(UNICODE_FRACTIONS)) {
            result = result.replace(new RegExp('(\\d)' + u, 'g'), '$1 ' + a);
            result = result.replace(new RegExp(u, 'g'), a);
        }
        const replacements = [];
        const tryAdd = (m, text) => {
            if (!replacements.some(r => m.index >= r.start && m.index < r.end)) {
                replacements.push({start: m.index, end: m.index + m[0].length, text});
            }
        };
        let m;
        const mixedRangeRe = /\b(\d+)\s+(\d+)\/(\d+)\s*[-–]\s*(\d+)\s+(\d+)\/(\d+)\b/g;
        while ((m = mixedRangeRe.exec(result))) {
            const a = parseInt(m[1]) + parseInt(m[2])/parseInt(m[3]);
            const b = parseInt(m[4]) + parseInt(m[5])/parseInt(m[6]);
            tryAdd(m, decimalToMixedNumber(a*scale) + '-' + decimalToMixedNumber(b*scale));
        }
        const partialMixedRangeRe = /\b(\d+)\s*[-–]\s*(\d+)\s+(\d+)\/(\d+)\b|\b(\d+)\s+(\d+)\/(\d+)\s*[-–]\s*(\d+)\b/g;
        while ((m = partialMixedRangeRe.exec(result))) {
            let a, b;
            if (m[1]) { a = parseInt(m[1]); b = parseInt(m[2]) + parseInt(m[3])/parseInt(m[4]); }
            else { a = parseInt(m[5]) + parseInt(m[6])/parseInt(m[7]); b = parseInt(m[8]); }
            tryAdd(m, decimalToMixedNumber(a*scale) + '-' + decimalToMixedNumber(b*scale));
        }
        const mixedRe = /\b(\d+)\s+(\d+)\/(\d+)\b/g;
        while ((m = mixedRe.exec(result))) {
            const v = parseInt(m[1]) + parseInt(m[2])/parseInt(m[3]);
            tryAdd(m, decimalToMixedNumber(v*scale));
        }
        const fractionRangeRe = /\b(\d+)\/(\d+)\s*[-–]\s*(\d+)\/(\d+)\b/g;
        while ((m = fractionRangeRe.exec(result))) {
            const a = parseInt(m[1])/parseInt(m[2]);
            const b = parseInt(m[3])/parseInt(m[4]);
            tryAdd(m, decimalToMixedNumber(a*scale) + '-' + decimalToMixedNumber(b*scale));
        }
        const fractionRe = /\b(\d+)\/(\d+)\b/g;
        while ((m = fractionRe.exec(result))) {
            const v = parseInt(m[1])/parseInt(m[2]);
            tryAdd(m, decimalToMixedNumber(v*scale));
        }
        const numberRangeRe = /\b(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)(?!\.?\d)/g;
        while ((m = numberRangeRe.exec(result))) {
            const a = parseFloat(m[1]), b = parseFloat(m[2]);
            const sa = a*scale, sb = b*scale;
            if (Number.isInteger(a) && Number.isInteger(b))
                tryAdd(m, Math.round(sa) + '-' + Math.round(sb));
            else
                tryAdd(m, decimalToMixedNumber(sa) + '-' + decimalToMixedNumber(sb));
        }
        const numberRe = /\b(\d+(?:\.\d+)?)(?!\.?\d|\/\d)/g;
        while ((m = numberRe.exec(result))) {
            const v = parseFloat(m[1]);
            const s = v*scale;
            if (Number.isInteger(v) && Number.isInteger(s))
                tryAdd(m, Math.round(s).toString());
            else
                tryAdd(m, decimalToMixedNumber(s));
        }
        replacements.sort((a, b) => b.start - a.start);
        for (const {start, end, text} of replacements) {
            result = result.substring(0, start) + text + result.substring(end);
        }
        return result;
    }

    // ===== App =====
    const escape = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('page-title');
    const subtitleEl = document.getElementById('page-subtitle');
    const backLinkEl = document.getElementById('back-link');
    const containerEl = document.getElementById('container');

    let manifest = null;
    let currentScale = 1;
    let currentRecipe = null;

    async function loadManifest() {
        if (manifest) return manifest;
        const res = await fetch('manifest.json');
        manifest = await res.json();
        return manifest;
    }

    function renderIndex(recipes) {
        titleEl.textContent = 'Recipes';
        subtitleEl.textContent = recipes.length + ' recipes';
        document.title = 'Recipes — Obermiller Family';
        backLinkEl.href = '/';
        backLinkEl.textContent = '← Home';
        containerEl.classList.remove('wide');

        const byCategory = {};
        for (const r of recipes) {
            (byCategory[r.category] = byCategory[r.category] || []).push(r);
        }
        const categories = Object.keys(byCategory).sort();

        let html = '';
        for (const cat of categories) {
            html += '<h2 class="category-title">' + escape(cat) + '</h2>';
            html += '<ul class="recipe-list">';
            for (const r of byCategory[cat]) {
                html += '<li><a class="recipe-link" href="#' + escape(r.slug) + '">' + escape(r.name) + '</a></li>';
            }
            html += '</ul>';
        }
        contentEl.classList.remove('loading');
        contentEl.innerHTML = html;
        window.scrollTo(0, 0);
    }

    function renderRecipe(recipe) {
        currentRecipe = recipe;
        titleEl.textContent = recipe.name;
        subtitleEl.textContent = '';
        document.title = recipe.name + ' — Recipes';
        backLinkEl.href = '#';
        backLinkEl.textContent = '← All recipes';
        containerEl.classList.add('wide');

        let html = '<div class="card">';
        if (recipe.image) {
            html += '<img class="recipe-image" src="' + escape(recipe.image) + '" alt="' + escape(recipe.name) + '">';
        }
        if (recipe.description) {
            html += '<p class="description">' + escape(recipe.description) + '</p>';
        }
        if (recipe.time) {
            const parts = [];
            if (recipe.time.total) parts.push('<strong>Total:</strong> ' + escape(recipe.time.total));
            if (recipe.time.prep) parts.push('<strong>Prep:</strong> ' + escape(recipe.time.prep));
            if (recipe.time.cook) parts.push('<strong>Cook:</strong> ' + escape(recipe.time.cook));
            if (parts.length) html += '<p class="meta">' + parts.join(' &nbsp;·&nbsp; ') + '</p>';
        }
        if (recipe.servings) {
            html += '<p class="meta"><strong>Servings:</strong> <span id="servings-text">' + escape(scaleIngredient(recipe.servings, currentScale)) + '</span></p>';
        }

        html += '<div class="recipe-grid">';

        html += '<div class="col-ingredients">';
        html += '<h2>Ingredients</h2>';
        html += '<div class="scale-group"><span class="scale-label">Scale:</span>';
        for (const s of [1, 1.5, 2, 3, 4]) {
            html += '<button class="scale-btn' + (s === currentScale ? ' active' : '') + '" data-scale="' + s + '">' + s + 'x</button>';
        }
        html += '</div>';
        html += '<div id="ingredients">' + renderIngredients(recipe, currentScale) + '</div>';
        html += '</div>';

        html += '<div class="col-directions">';
        html += '<h2>Directions</h2><ol class="directions">';
        for (const d of recipe.directions) html += '<li>' + escape(d) + '</li>';
        html += '</ol>';
        html += '</div>';

        html += '</div>';

        if (recipe.notes && recipe.notes.length) {
            html += '<h2>Notes</h2><ul class="notes">';
            for (const n of recipe.notes) html += '<li>' + escape(n) + '</li>';
            html += '</ul>';
        }

        if (recipe.source) {
            html += '<p class="source">Adapted from ';
            if (recipe.source.url) {
                html += '<a rel="noopener noreferrer" target="_blank" href="' + escape(recipe.source.url) + '">' + escape(recipe.source.name) + '</a>';
            } else {
                html += escape(recipe.source.name);
            }
            html += '.</p>';
        }
        html += '</div>';

        contentEl.classList.remove('loading');
        contentEl.innerHTML = html;

        for (const btn of contentEl.querySelectorAll('.scale-btn')) {
            btn.addEventListener('click', () => {
                currentScale = parseFloat(btn.dataset.scale);
                for (const b of contentEl.querySelectorAll('.scale-btn')) {
                    b.classList.toggle('active', parseFloat(b.dataset.scale) === currentScale);
                }
                document.getElementById('ingredients').innerHTML = renderIngredients(currentRecipe, currentScale);
                const servingsEl = document.getElementById('servings-text');
                if (servingsEl && currentRecipe.servings) {
                    servingsEl.textContent = scaleIngredient(currentRecipe.servings, currentScale);
                }
            });
        }
        window.scrollTo(0, 0);
    }

    function renderIngredients(recipe, scale) {
        let html = '';
        for (const group of recipe.ingredientGroups) {
            if (group.name) html += '<h3>' + escape(group.name) + '</h3>';
            html += '<ul class="ingredients">';
            for (const ing of group.ingredients) {
                html += '<li><label class="ingredient-label"><input type="checkbox"><span>' + escape(scaleIngredient(ing, scale)) + '</span></label></li>';
            }
            html += '</ul>';
        }
        return html;
    }

    async function route() {
        const hash = window.location.hash.replace(/^#/, '');
        contentEl.classList.add('loading');
        contentEl.innerHTML = 'Loading…';
        const recipes = await loadManifest();
        if (!hash) {
            currentScale = 1;
            renderIndex(recipes);
            return;
        }
        try {
            const res = await fetch(hash + '.json');
            if (!res.ok) throw new Error('Not found');
            const recipe = await res.json();
            currentScale = 1;
            renderRecipe(recipe);
        } catch (e) {
            contentEl.classList.remove('loading');
            contentEl.innerHTML = '<div class="card"><p>Recipe not found. <a class="recipe-link" href="#">Back to all recipes</a></p></div>';
        }
    }

    window.addEventListener('hashchange', route);
    route();
    </script>
</body>
</html>
