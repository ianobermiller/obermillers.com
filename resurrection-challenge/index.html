<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resurrection Challenge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #ccc;
    }
    h1 { margin-bottom: 12px; font-size: 1rem; letter-spacing: 0.1em; }
    .game-container {
      border: 2px solid #333;
      display: inline-block;
      position: relative;
    }
    #nav-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .nav-btn {
      position: absolute;
      pointer-events: all;
      cursor: pointer;
      background: rgba(30, 60, 120, 0.85);
      border: 1px solid rgba(100, 150, 255, 0.7);
      color: #c0d8ff;
      font-size: 11px;
      font-family: sans-serif;
      padding: 4px 10px;
      border-radius: 3px;
      display: none;
    }
    .nav-btn:hover {
      background: rgba(50, 90, 180, 0.95);
      border-color: #90b8ff;
      color: #fff;
    }
  </style>
  <script src="dirplayer-polyfill.js"></script>
  <script src="dirplayer-fixes.js"></script>
</head>
<body>
  <h1>Resurrection Challenge</h1>
  <div class="game-container">
    <embed
      src="game/ResChallenge/BookCD RC MX Pres.dcr"
      type="application/x-director"
      width="800"
      height="600"
    >
    <div id="nav-overlay">
      <!-- Frame 90 (Options): HOW TO PLAY button overlay -->
      <button id="btn-howtoplay" class="nav-btn"
        style="right: 75px; bottom: 15px;"
        title="How to Play">HOW TO PLAY</button>
      <!-- Frame 78 (Game Instructions): MENU button overlay -->
      <button id="btn-menu" class="nav-btn"
        style="right: 20px; top: 15px;"
        title="Menu">MENU</button>
    </div>
  </div>
  <p style="margin-top:8px;font-size:0.75rem;">
    Using <a href="https://github.com/igorlira/dirplayer-rs" style="color:#66f">dirplayer-rs</a>
  </p>
</body>
</html>
