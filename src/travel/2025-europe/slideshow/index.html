    <title>Europe 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --kraft: #c9a36a;
        --kraft-dark: #9c7540;
        --ink: #2a1c12;
        --paper: #fffaf1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2a1c12;
        color: var(--ink);
        font-family: Fredoka, "Trebuchet MS", sans-serif;
      }
      .deck {
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        inset: 0;
        display: none;
        padding: 8px 18px 56px;
        background:
          radial-gradient(circle at 20% 10%, #e8c888 0, transparent 28%),
          radial-gradient(circle at 80% 90%, #b07838 0, transparent 32%),
          repeating-linear-gradient(90deg, #00000010 0 2px, transparent 2px 7px), var(--kraft);
      }
      .slide.is-on {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .title-slide {
        color: var(--paper);
        text-shadow: 0 2px 0 #0003;
        grid-template-rows: 1fr auto;
        align-content: stretch;
      }
      .title-slide h1 {
        font-family: Caveat, cursive;
        font-size: clamp(64px, 11vw, 128px);
        margin: 0;
        line-height: 0.9;
        transform: rotate(-3deg);
      }
      .title-slide p {
        font-family: Caveat, cursive;
        font-size: clamp(22px, 3vw, 36px);
        max-width: 28ch;
        margin: 8px 0 18px;
        transform: rotate(-2deg);
      }
      .route {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        align-self: end;
      }
      .route span {
        background: var(--paper);
        color: var(--ink);
        font-family: Caveat, cursive;
        font-size: 22px;
        padding: 2px 12px 4px;
        transform: rotate(var(--r, -2deg));
        box-shadow: 1px 2px 0 #0002;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6b3b16;
      }
      h2 {
        font-family: Caveat, cursive;
        font-size: clamp(28px, 3.2vw, 42px);
        margin: 0;
        line-height: 0.9;
      }
      .lede {
        font-family: Caveat, cursive;
        font-size: 20px;
        margin: 2px 0 0;
        max-width: 70vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .count {
        font-family: Caveat, cursive;
        font-size: 20px;
        color: #6b3b16;
      }
      .table {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: center;
        gap: 1.6vw;
        min-height: 0;
      }
      .polaroid {
        background: var(--paper);
        padding: 0.7vh 0.7vh 0;
        box-shadow:
          3px 10px 18px #0003,
          0 0 0 1px #0000000d;
        transform: rotate(var(--r));
        cursor: zoom-in;
        border: 0;
        display: grid;
        justify-items: center;
      }
      .polaroid img {
        display: block;
        width: auto;
        height: auto;
        background: #1d140c;
      }
      .table.count-1 .polaroid img {
        max-height: 82vh;
        max-width: 80vw;
      }
      .table.count-2 .polaroid.portrait img {
        max-height: 80vh;
        max-width: 38vw;
      }
      .table.count-2 .polaroid.landscape img {
        max-height: 76vh;
        max-width: 46vw;
      }
      .table.count-3 .polaroid.portrait img {
        max-height: 76vh;
        max-width: 28vw;
      }
      .table.count-3 .polaroid.landscape img {
        max-height: 64vh;
        max-width: 30vw;
      }
      .polaroid span {
        font-family: Caveat, cursive;
        font-size: clamp(18px, 1.8vw, 26px);
        padding: 0.8vh 8px 1.4vh;
        text-align: center;
      }
      .nav {
        position: fixed;
        right: 18px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        z-index: 3;
      }
      .nav button,
      .close {
        appearance: none;
        border: 0;
        background: #2a1c12;
        color: var(--paper);
        width: 46px;
        height: 46px;
        border-radius: 999px;
        font-size: 22px;
        cursor: pointer;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: #120c08f2;
        display: none;
        place-items: center;
        z-index: 5;
        cursor: zoom-out;
        padding: 24px;
      }
      #lightbox.is-on {
        display: grid;
      }
      #lightbox img {
        max-width: 92vw;
        max-height: 84vh;
        box-shadow: 0 20px 60px #0008;
      }
      #lightbox p {
        font-family: Caveat, cursive;
        color: var(--paper);
        font-size: 28px;
        margin: 10px 0 0;
        text-align: center;
      }
    </style>
  </head>

                file: "citadel-of-liege-16BC673E.webp",
                caption: "Citadel of Liège",
                orient: "portrait",
              },
              {
                file: "fort-de-la-chartreuse-601299F2.webp",
                caption: "Fort de la Chartreuse",
                orient: "landscape",
              },
              { file: "la-boverie-2B6690F8.webp", caption: "La Boverie", orient: "portrait" },
            ],
          },
          {
            title: "Aachen & Monschau",
            kicker: "Germany · Aug 21",
            description: "Printen, then a detour to Monschau.",
            photos: [
              {
                file: "aachen-cathedral-16519439.webp",
                caption: "Aachen Cathedral",
                orient: "landscape",
              },
              { file: "monschau-EB5A5BED.webp", caption: "Monschau", orient: "portrait" },
            ],
          },
          {
            title: "Valkenburg & Maastricht",
            kicker: "Netherlands · Aug 23–24",
            description: "Caves, a toboggan, then Maastricht.",
            photos: [
              { file: "mergelrijk-AB834A70.webp", caption: "Mergelrijk", orient: "portrait" },
              {
                file: "valkenburg-castle-C7410DD5.webp",
                caption: "Valkenburg castle",
                orient: "portrait",
              },
              { file: "maastricht-B9E3C79A.webp", caption: "Maastricht", orient: "landscape" },
            ],
          },
          {
            title: "Tongeren",
            kicker: "Belgium · Aug 24",
            description: "Ambiorix and the basilica.",
            photos: [
              {
                file: "gallo-roman-museum-93620FC5.webp",
                caption: "Gallo-Roman Museum",
                orient: "portrait",
              },
              { file: "ambiorix-322E2AFC.webp", caption: "Ambiorix", orient: "portrait" },
            ],
          },
          {
            title: "Leuven",
            kicker: "Belgium · Aug 25",
            description: "A stroll before the sleeper to Berlin.",
            photos: [
              {
                file: "leuven-town-hall-F324052D.webp",
                caption: "Leuven Town Hall",
                orient: "landscape",
              },
            ],
          },
          {
            title: "Berlin",
            kicker: "Germany · Aug 26–29",
            description: "Dawn at Ostbahnhof, then Museum Island.",
            photos: [
              {
                file: "east-side-gallery-3AB8806D.webp",
                caption: "East Side Gallery",
                orient: "landscape",
              },
              {
                file: "museum-island-3599D3EF.webp",
                caption: "Museum Island",
                orient: "landscape",
              },
            ],
          },
        ],
      };
      const deck = document.getElementById("deck");
      const total = DATA.slides.length + 1;
      const tilts = [-3.2, 2.4, -1.1, 3.6, -2.8, 1.4];

      const title = document.createElement("section");
      title.className = "slide title-slide is-on";
      title.innerHTML = `
      <div>
        <h1>${DATA.title}</h1>
        <p>${DATA.subtitle}</p>
      </div>
      <div class="route">
        ${[
          "Norway",
          "Poland",
          "Austria",
          "Slovakia",
          "Hungary",
          "Romania",
          "Czechia",
          "Italy",
          "Belgium",
          "Germany",
        ]
          .map((name, i) => `<span style="--r:${(i % 2 ? 2 : -2) + i * 0.2}deg">${name}</span>`)
          .join("")}
      </div>`;
      deck.appendChild(title);

      DATA.slides.forEach((slide, i) => {
        const section = document.createElement("section");
        section.className = "slide";
        section.innerHTML = `
        <header>
          <div>
            <div class="kicker">${slide.kicker}</div>
            <h2>${slide.title}</h2>
            ${slide.description ? `<p class="lede">${slide.description}</p>` : ""}
          </div>
          <div class="count">${i + 2} / ${total}</div>
        </header>
        <div class="table count-${slide.photos.length}">
          ${slide.photos
            .map(
              (photo, p) => `
            <button type="button" class="polaroid ${photo.orient}" style="--r:${tilts[p % tilts.length]}deg"
              data-src="images/${photo.file}" data-caption="${photo.caption}">
              <img src="images/${photo.file}" alt="${photo.caption || slide.title}" />
              ${photo.caption ? `<span>${photo.caption}</span>` : ""}
            </button>`,
            )
            .join("")}
        </div>`;
        deck.appendChild(section);
      });

      const slides = [...deck.querySelectorAll(".slide")];
      let index = 0;
      function show(next) {
        index = (next + slides.length) % slides.length;
        slides.forEach((el, i) => el.classList.toggle("is-on", i === index));
      }
      document.getElementById("prev").onclick = () => show(index - 1);
      document.getElementById("next").onclick = () => show(index + 1);

      const box = document.getElementById("lightbox");
      const boxImg = box.querySelector("img");
      const boxCap = box.querySelector("p");
      function openLite(src, caption) {
        boxImg.src = src;
        boxImg.alt = caption;
        boxCap.textContent = caption;
        boxCap.style.display = caption ? "" : "none";
        box.classList.add("is-on");
      }
      function closeLite() {
        box.classList.remove("is-on");
        boxImg.src = "";
      }
      window.addEventListener("keydown", (event) => {
        if (box.classList.contains("is-on")) {
          if (event.key === "Escape" || event.key === " ") {
            event.preventDefault();
            closeLite();
          }
          return;
        }
        if (event.key === "ArrowRight" || event.key === " ") {
          event.preventDefault();
          show(index + 1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          show(index - 1);
        }
      });
      deck.addEventListener("click", (event) => {
        const card = event.target.closest(".polaroid");
        if (!card) return;
        openLite(card.dataset.src, card.dataset.caption);
      });
      box.addEventListener("click", closeLite);
    </script>
  </body>
</html>
