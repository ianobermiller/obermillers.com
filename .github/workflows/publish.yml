# Quality checks on PRs and main; publish the site when checks pass on main.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "pocketbase/**"
      - ".github/workflows/pocketbase.yml"
  pull_request:
    paths-ignore:
      - "pocketbase/**"
      - ".github/workflows/pocketbase.yml"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Typecheck
        run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Lint
        run: npm run lint

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Format
        run: npm run fmt:check

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Knip
        run: npm run knip

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Test
        run: npm test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, fmt, knip, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H obermillers.com >> ~/.ssh/known_hosts

      - name: Publish via rsync
        run: |
          rsync --archive --verbose --compress --delete \
            --exclude='.git' \
            --exclude='.well-known' \
            --exclude='blog' \
            --exclude='museums' \
            --exclude='wp-content' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ iano@obermillers.com:~/www/obermillers/
