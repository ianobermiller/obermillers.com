# Publish site to obermillers.com on push to main
name: Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "pocketbase/**"
      - ".github/workflows/pocketbase.yml"
  pull_request:
    paths-ignore:
      - "pocketbase/**"
      - ".github/workflows/pocketbase.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, lint, format, knip
        run: npm run check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H obermillers.com >> ~/.ssh/known_hosts

      - name: Publish via rsync
        run: |
          rsync --archive --verbose --compress --delete \
            --exclude='.git' \
            --exclude='blog' \
            --exclude='cal' \
            --exclude='museums' \
            --exclude='wp-content' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ iano@obermillers.com:~/www/obermillers/
