<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Tiler</title>
    <script type="importmap">
    {
        "imports": {
            "onnxruntime-web": "./js/onnxruntime-web/ort.min.mjs"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #764ba2;
            background: rgba(255, 255, 255, 0.95);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-left: 4px solid #667eea;
            border-radius: 4px;
            color: #333;
            font-size: 0.9rem;
            min-height: 20px;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.error {
            background: rgba(234, 67, 53, 0.1);
            border-left-color: #ea4335;
        }

        .status.success {
            background: rgba(53, 234, 67, 0.1);
            border-left-color: #35ea43;
        }

        .preview-section {
            margin-top: 30px;
            text-align: center;
        }

        .preview-label {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        canvas {
            border: 2px solid #667eea;
            border-radius: 8px;
            background: #fff;
            max-width: 100%;
            height: auto;
        }

        #finalPreview {
            margin-top: 20px;
        }

        .download-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background: #764ba2;
        }

        .download-btn.active {
            display: inline-block;
        }

        .thumbnails {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Passport Photo Tiler</h1>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            <div class="status" id="status"></div>
            <div class="thumbnails" id="thumbnails"></div>
        </div>

        <div class="preview-section">
            <div class="preview-label">Final Result (4" × 6")</div>
            <div id="placeholderPreview">
                <svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
                    <rect width="1200" height="1800" fill="#ffffff"/>
                    <!-- 2 columns x 3 rows = 6 passport photo silhouettes -->
                    <g>
                        <!-- Row 1 -->
                        <rect x="0" y="0" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="300" cy="250" r="80" fill="#ddd"/>
                        <rect x="220" y="320" width="160" height="200" rx="80" fill="#ddd"/>
                        <rect x="0" y="600" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="300" cy="850" r="80" fill="#ddd"/>
                        <rect x="220" y="920" width="160" height="200" rx="80" fill="#ddd"/>
                        <!-- Row 2 -->
                        <rect x="600" y="0" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="900" cy="250" r="80" fill="#ddd"/>
                        <rect x="820" y="320" width="160" height="200" rx="80" fill="#ddd"/>
                        <rect x="600" y="600" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="900" cy="850" r="80" fill="#ddd"/>
                        <rect x="820" y="920" width="160" height="200" rx="80" fill="#ddd"/>
                        <!-- Row 3 -->
                        <rect x="0" y="1200" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="300" cy="1450" r="80" fill="#ddd"/>
                        <rect x="220" y="1520" width="160" height="200" rx="80" fill="#ddd"/>
                        <rect x="600" y="1200" width="600" height="600" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                        <circle cx="900" cy="1450" r="80" fill="#ddd"/>
                        <rect x="820" y="1520" width="160" height="200" rx="80" fill="#ddd"/>
                    </g>
                </svg>
            </div>
            <canvas id="finalPreview" style="display: none;"></canvas>
            <button class="download-btn" id="downloadBtn" style="display: none;">Download Passport Photos</button>
        </div>
    </div>

    <script type="module">
        import Human from './js/human.esm.js';
        import { removeBackground } from './js/background-removal.js';

        // State management
        let selectedFiles = [];
        let croppedImages = [];
        let modelsLoaded = false;

        // DOM elements
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const thumbnailsDiv = document.getElementById('thumbnails');
        const placeholderPreview = document.getElementById('placeholderPreview');
        const finalCanvasEl = document.getElementById('finalPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        // Initialize Human library
        const human = new Human({
            backend: 'webgl',
            modelBasePath: './models/',
            face: {
                enabled: true,
                detector: { rotation: false },
                mesh: { enabled: true },
                iris: { enabled: false },
                emotion: { enabled: false },
                description: { enabled: false }
            },
            body: { enabled: false },
            hand: { enabled: false },
            object: { enabled: false }
        });

        // Load models silently at startup
        async function loadModels() {
            if (modelsLoaded) return;
            try {
                await human.load();
                modelsLoaded = true;
                console.log('Human models loaded');
            } catch (err) {
                console.error('Model loading error:', err);
                throw err;
            }
        }

        // Status display helper
        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = 'status active ' + type;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        // File input handler
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);

            if (files.length === 0) {
                showStatus('Please select at least one image.', 'error');
                return;
            }

            if (files.length > 6) {
                showStatus('Please select no more than 6 images.', 'error');
                return;
            }

            selectedFiles = files;
            showStatus(`Selected ${files.length} image(s). Processing...`, 'info');

            // Clear previous results
            croppedImages = [];
            thumbnailsDiv.innerHTML = '';
            downloadBtn.className = 'download-btn';
            downloadBtn.style.display = 'none';
            // Show placeholder again
            placeholderPreview.style.display = 'block';
            finalCanvasEl.style.display = 'none';

            // Display thumbnails
            files.forEach((file) => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'thumbnail';
                thumbnailsDiv.appendChild(img);
            });

            // Process images
            await processAllImages();
        });

        // Load image from file
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        // Process image: remove background and crop to passport standards
        async function processImage(img) {

            // Resize for faster processing
            const maxDetectSize = 512;
            const scale = maxDetectSize / Math.max(img.width, img.height);
            const detectCanvas = document.createElement('canvas');
            detectCanvas.width = img.width * scale;
            detectCanvas.height = img.height * scale;
            const detectCtx = detectCanvas.getContext('2d');
            detectCtx.drawImage(img, 0, 0, detectCanvas.width, detectCanvas.height);
            const detectImg = new Image();
            detectImg.src = detectCanvas.toDataURL('image/jpeg', 0.8);
            await new Promise((resolve) => { detectImg.onload = resolve; });

            // Background removal using @imgly/background-removal
            let processedImg = img;
            try {
                // Convert image to blob/data URL for background removal
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                // Convert canvas to blob
                const blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.9);
                });

                // Remove background - returns a PNG blob with transparent background
                // Construct absolute URL for publicPath
                const publicPath = new URL('./background-removal-assets/models/', window.location.href).toString();
                const resultBlob = await removeBackground(blob, {
                    publicPath: publicPath,
                    model: 'isnet_fp16', // Use medium model for better quality (~84MB)
                    output: {
                        format: 'image/png',
                        type: 'foreground'
                    }
                });

                // Create canvas with white background and composite the result
                const resultCanvas = document.createElement('canvas');
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                const resultCtx = resultCanvas.getContext('2d');

                // Fill with white background
                resultCtx.fillStyle = '#ffffff';
                resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

                // Draw the background-removed image on top
                const resultImg = new Image();
                resultImg.src = URL.createObjectURL(resultBlob);
                await new Promise((resolve) => { resultImg.onload = resolve; });
                resultCtx.drawImage(resultImg, 0, 0);
                URL.revokeObjectURL(resultImg.src);

                // Convert back to image
                processedImg = new Image();
                processedImg.src = resultCanvas.toDataURL('image/jpeg', 0.9);
                await new Promise((resolve) => { processedImg.onload = resolve; });
                console.log('Background removal successful');
            } catch (err) {
                console.warn('Background removal failed, using original image:', err);
            }

            // Crop to square with face detection
            return cropToPassportSize(processedImg, detectImg, scale);
        }

        // Crop to US Passport photo standards (2"x2" at 300 DPI = 600x600px)
        async function cropToPassportSize(img, detectImg, scale) {
            const targetSize = 600; // 2" at 300 DPI
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let width = img.width;
            let height = img.height;
            let size = Math.min(width, height);
            let x = (width - size) / 2;
            let y = (height - size) / 2;

            // Face detection on resized image
            try {
                const result = await human.detect(detectImg);
                const face = result.face[0];
                if (face && face.landmarks) {
                    const landmarks = face.landmarks;
                    const eyes = landmarks.filter(l => l[0] >= 36 && l[0] <= 47); // Eye landmarks
                    const topOfHead = landmarks[27]; // Approximate top of head
                    const bottomOfChin = landmarks[8]; // Approximate bottom of chin

                    // Scale landmarks back to original image size
                    const scaleBack = 1 / scale;
                    const headHeight = (bottomOfChin[1] - topOfHead[1]) * scaleBack;
                    // Target head height: 1" to 1 3/8" (150-210px at 300 DPI), use 180px (60% of 300px)
                    const targetHeadHeight = 180;
                    const targetImageSize = (headHeight / targetHeadHeight) * targetSize;
                    // Eye level: 1 1/8 to 1 3/8 inches from bottom, use midpoint (1.25 inches)
                    // At 2-inch photo, eye level should be 1.25/2 = 62.5% from bottom
                    const targetEyeLevelPercentage = 0.625;

                    // Calculate eye center
                    const eyeCenterY = (eyes.reduce((sum, e) => sum + e[1], 0) / eyes.length) * scaleBack;
                    // Desired eye position in new image
                    const newEyeY = targetSize * targetEyeLevelPercentage;
                    // Calculate crop Y offset
                    y = eyeCenterY - newEyeY;
                    // Ensure crop stays within bounds
                    y = Math.max(0, Math.min(y, height - targetSize));
                    size = targetSize;
                    // Center horizontally
                    x = (width - size) / 2;
                }
            } catch (err) {
                console.warn('Face detection failed, using center crop');
            }

            // Crop to passport size
            canvas.width = targetSize;
            canvas.height = targetSize;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, targetSize, targetSize);
            ctx.drawImage(img, x, y, size, size, 0, 0, targetSize, targetSize);
            return new Promise((resolve) => {
                const croppedImg = new Image();
                croppedImg.onload = () => resolve(croppedImg);
                croppedImg.src = canvas.toDataURL('image/jpeg', 0.9);
            });
        }

        // Process all images through pipeline
        async function processAllImages() {
            // Wait for models if not loaded yet
            if (!modelsLoaded) {
                showStatus('Loading models...', 'info');
                await loadModels();
                hideStatus();
            }

            try {
                croppedImages = [];

                // Process each image
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    showStatus(`Processing image ${i + 1} of ${selectedFiles.length}...`, 'info');
                    try {
                        const img = await loadImage(file);
                        const processedImg = await processImage(img);
                        croppedImages.push(processedImg);
                    } catch (err) {
                        showStatus(`Error processing image ${i + 1}: ${err.message}`, 'error');
                        console.error(err);
                        // Create default passport-sized image on error
                        const defaultCanvas = document.createElement('canvas');
                        defaultCanvas.width = 600;
                        defaultCanvas.height = 600;
                        const ctx = defaultCanvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, 600, 600);
                        const img = await loadImage(file);
                        ctx.drawImage(img, 0, 0, 600, 600);
                        const defaultImg = new Image();
                        defaultImg.src = defaultCanvas.toDataURL('image/jpeg', 0.9);
                        await new Promise((resolve) => { defaultImg.onload = resolve; });
                        croppedImages.push(defaultImg);
                    }
                }

                // Create tiled layout
                showStatus('Creating tiled layout...', 'info');
                createTiledLayout();

                showStatus('Processing complete!', 'success');
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        // Create 4"x6" tiled layout (2 columns x 3 rows)
        function createTiledLayout() {
            // Final canvas: 4" x 6" at 300 DPI = 1200 x 1800 pixels
            // Each photo: 2" x 2" at 300 DPI = 600 x 600 pixels
            // Grid: 2 columns x 3 rows = 6 photos total

            const finalWidth = 1200; // 4" at 300 DPI
            const finalHeight = 1800; // 6" at 300 DPI
            const photoSize = 600; // 2" at 300 DPI
            const cols = 2;
            const rows = 3;

            finalCanvasEl.width = finalWidth;
            finalCanvasEl.height = finalHeight;
            const ctx = finalCanvasEl.getContext('2d');

            // Fill white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, finalWidth, finalHeight);

            // Repeat images to fill 6 slots
            const imagesToTile = [];
            if (croppedImages.length === 0) return;

            // Fill array with repeated images
            while (imagesToTile.length < 6) {
                imagesToTile.push(...croppedImages);
            }
            const finalImages = imagesToTile.slice(0, 6);

            // Tile images: 2 columns x 3 rows
            for (let i = 0; i < 6; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * photoSize;
                const y = row * photoSize;

                if (finalImages[i]) {
                    ctx.drawImage(finalImages[i], x, y, photoSize, photoSize);
                }
            }

            // Hide placeholder and show final result
            placeholderPreview.style.display = 'none';
            finalCanvasEl.style.display = 'block';

            // Show download button
            downloadBtn.className = 'download-btn active';
            downloadBtn.style.display = 'inline-block';
        }

        // Download handler
        downloadBtn.addEventListener('click', () => {
            finalCanvasEl.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'passport-photos-4x6.jpg';
                link.href = url;
                document.body.appendChild(link);
                setTimeout(() => {
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 0);
            }, 'image/jpeg', 0.9);
        });

        // Initialize models on page load
        loadModels().catch(err => {
            console.error('Failed to load models:', err);
        });
    </script>
</body>
</html>
