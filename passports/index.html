<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Tiler</title>
    <script type="importmap">
    {
        "imports": {
            "onnxruntime-web": "./js/onnxruntime-web/ort.min.mjs",
            "onnxruntime-web/webgpu": "./js/onnxruntime-web/webgpu.mjs"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        .description {
            font-size: 1rem;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #764ba2;
            background: rgba(255, 255, 255, 0.95);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-left: 4px solid #667eea;
            border-radius: 4px;
            color: #333;
            font-size: 0.9rem;
            min-height: 20px;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.error {
            background: rgba(234, 67, 53, 0.1);
            border-left-color: #ea4335;
        }

        .status.success {
            background: rgba(53, 234, 67, 0.1);
            border-left-color: #35ea43;
        }

        .preview-section {
            margin-top: 30px;
            text-align: center;
        }

        canvas {
            border: 2px solid #667eea;
            border-radius: 8px;
            background: #fff;
            max-width: 100%;
            height: auto;
        }

        #finalPreview {
            margin-top: 20px;
        }


        .download-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background: #764ba2;
        }

        .download-btn.active {
            display: inline-block;
        }

        .thumbnails {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 2px solid #667eea;
        }

        .options {
            margin: 20px 0;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 8px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-wrapper:last-of-type {
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-label {
            color: #333;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        .note {
            margin-top: 15px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            color: #555;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Passport Photo Tiler</h1>
        <p class="description">Upload up to 6 photos to create a 4" × 6" sheet of passport photos ready for printing.</p>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            <div class="options">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="enableCropping" checked>
                    <label for="enableCropping" class="checkbox-label">Crop to passport size (2" × 2")</label>
                </div>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="enableBackgroundRemoval" checked>
                    <label for="enableBackgroundRemoval" class="checkbox-label">Remove background</label>
                </div>
                <div class="note">
                    If background removal looks bad or fails, try using macOS Quick Actions: Right-click your image → Quick Actions → Remove Background, then upload the result.
                </div>
            </div>
            <div class="status" id="status"></div>
            <div class="thumbnails" id="thumbnails"></div>
        </div>

        <div class="preview-section">
            <canvas id="finalPreview" style="display: none;"></canvas>
            <button class="download-btn" id="downloadBtn" style="display: none;">Download Passport Photos</button>
        </div>
    </div>

    <script type="module">
        // State management
        let selectedFiles = [];
        let croppedImages = [];

        // DOM elements
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const thumbnailsDiv = document.getElementById('thumbnails');
        const finalCanvasEl = document.getElementById('finalPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const enableCroppingCheckbox = document.getElementById('enableCropping');
        const enableBackgroundRemovalCheckbox = document.getElementById('enableBackgroundRemoval');

        // Status display helper
        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = 'status active ' + type;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        // Function to handle file processing
        async function handleFileSelection(files) {
            if (files.length === 0) {
                showStatus('Please select at least one image.', 'error');
                return;
            }

            if (files.length > 6) {
                showStatus('Please select no more than 6 images.', 'error');
                return;
            }

            selectedFiles = files;
            showStatus(`Selected ${files.length} image(s). Processing...`, 'info');

            // Clear previous results
            croppedImages = [];
            thumbnailsDiv.innerHTML = '';
            downloadBtn.className = 'download-btn';
            downloadBtn.style.display = 'none';
            finalCanvasEl.style.display = 'none';

            // Process images
            await processAllImages();
        }

        // File input handler
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            await handleFileSelection(files);
        });

        // Reprocess when settings change (if files are already selected)
        function handleSettingChange() {
            if (selectedFiles.length > 0) {
                showStatus('Reprocessing with new settings...', 'info');
                processAllImages();
            }
        }

        enableCroppingCheckbox.addEventListener('change', handleSettingChange);
        enableBackgroundRemovalCheckbox.addEventListener('change', handleSettingChange);

        // Load image from file
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        // Resize image to target dimensions
        async function resizeImage(img, targetWidth, targetHeight) {
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

            return new Promise((resolve) => {
                const resizedImg = new Image();
                resizedImg.onload = () => resolve(resizedImg);
                resizedImg.src = canvas.toDataURL('image/jpeg', 0.8);
            });
        }

        // Process image: remove background and crop to passport standards
        async function processImage(img, imageIndex, totalImages) {
            const enableCropping = enableCroppingCheckbox.checked;
            const enableBackgroundRemoval = enableBackgroundRemovalCheckbox.checked;

            if (enableCropping) {
                // Crop to square with face detection
                const maxDetectSize = 512;
                const scale = maxDetectSize / Math.max(img.width, img.height);
                const detectImg = await resizeImage(img, img.width * scale, img.height * scale);
                const { cropImage } = await import('./js/cropImage.js');
                img = await cropImage(img, detectImg, scale, true);
            } else {
                // If cropping is disabled, resize to passport size (600x600)
                img = await resizeImage(img, 600, 600);
            }

            if (enableBackgroundRemoval) {
                const { removeBackgroundImage } = await import('./js/removeBackgroundImage.js');
                // Create progress callback for background removal
                const progressCallback = (step, current, total) => {
                    const stepNames = {
                        'compute:decode': 'Decoding image',
                        'compute:inference': 'Running AI model',
                        'compute:mask': 'Applying mask',
                        'compute:encode': 'Encoding result'
                    };
                    const stepName = stepNames[step] || step;
                    showStatus(`Image ${imageIndex + 1}/${totalImages}: ${stepName} (${current}/${total})...`, 'info');
                };
                img = await removeBackgroundImage(img, progressCallback);
            }

            return img;
        }

        // Process all images through pipeline
        async function processAllImages() {
            try {
                croppedImages = [];

                // Process each image
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    showStatus(`Processing image ${i + 1} of ${selectedFiles.length}...`, 'info');
                    try {
                        const img = await loadImage(file);
                        const processedImg = await processImage(img, i, selectedFiles.length);
                        croppedImages.push(processedImg);
                    } catch (err) {
                        showStatus(`Error processing image ${i + 1}: ${err.message}`, 'error');
                        console.error(err);
                        // Create default passport-sized image on error
                        const defaultCanvas = document.createElement('canvas');
                        defaultCanvas.width = 600;
                        defaultCanvas.height = 600;
                        const ctx = defaultCanvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, 600, 600);
                        const img = await loadImage(file);
                        ctx.drawImage(img, 0, 0, 600, 600);
                        const defaultImg = new Image();
                        defaultImg.src = defaultCanvas.toDataURL('image/jpeg', 0.9);
                        await new Promise((resolve) => { defaultImg.onload = resolve; });
                        croppedImages.push(defaultImg);
                    }
                }

                // Create tiled layout
                showStatus('Creating tiled layout...', 'info');
                createTiledLayout();

                hideStatus();
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        // Tile images into a 4"x6" layout (2 columns x 3 rows)
        function tileImages(images) {
            // Final canvas: 4" x 6" at 300 DPI = 1200 x 1800 pixels
            // Each photo: 2" x 2" at 300 DPI = 600 x 600 pixels
            // Grid: 2 columns x 3 rows = 6 photos total

            const finalWidth = 1200; // 4" at 300 DPI
            const finalHeight = 1800; // 6" at 300 DPI
            const photoSize = 600; // 2" at 300 DPI
            const cols = 2;
            const rows = 3;

            const canvas = document.createElement('canvas');
            canvas.width = finalWidth;
            canvas.height = finalHeight;
            const ctx = canvas.getContext('2d');

            // Fill white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, finalWidth, finalHeight);

            // Repeat images to fill 6 slots
            const imagesToTile = [];
            if (images.length === 0) return canvas;

            // Fill array with repeated images
            while (imagesToTile.length < 6) {
                imagesToTile.push(...images);
            }
            const finalImages = imagesToTile.slice(0, 6);

            // Tile images: 2 columns x 3 rows
            for (let i = 0; i < 6; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = col * photoSize;
                const y = row * photoSize;

                if (finalImages[i]) {
                    ctx.drawImage(finalImages[i], x, y, photoSize, photoSize);
                }
            }

            return canvas;
        }

        // Create 4"x6" tiled layout (2 columns x 3 rows)
        function createTiledLayout() {
            const tiledCanvas = tileImages(croppedImages);

            // Copy to final canvas element
            finalCanvasEl.width = tiledCanvas.width;
            finalCanvasEl.height = tiledCanvas.height;
            const ctx = finalCanvasEl.getContext('2d');
            ctx.drawImage(tiledCanvas, 0, 0);

            // Show final result
            finalCanvasEl.style.display = 'block';

            // Show download button
            downloadBtn.className = 'download-btn active';
            downloadBtn.style.display = 'inline-block';
        }

        // Download handler
        downloadBtn.addEventListener('click', () => {
            finalCanvasEl.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'passport-photos-4x6.jpg';
                link.href = url;
                document.body.appendChild(link);
                setTimeout(() => {
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 0);
            }, 'image/jpeg', 0.9);
        });
    </script>
</body>
</html>
