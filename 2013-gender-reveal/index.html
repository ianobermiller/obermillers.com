<html>
<head>
<title>Obermiller Baby Gender Reveal</title>
<script type="text/javascript">
window.addEventListener('DOMContentLoaded', function() {
    var canvas = document.getElementById('canvas');
    var context = canvas.getContext('2d');
    var image = new Image();
    var drawing = false;

    image.src = 'gender-reveal.png';
    image.addEventListener('load', function() {
        context.drawImage(image, 0, 0);
    });

    function clear(event) {
        var bounds = canvas.getBoundingClientRect();
        var scaleX = canvas.width / bounds.width;
        var scaleY = canvas.height / bounds.height;
        var x = (event.clientX - bounds.left) * scaleX;
        var y = (event.clientY - bounds.top) * scaleY;

        context.save();
        context.globalCompositeOperation = 'destination-out';
        context.beginPath();
        context.arc(x, y, 15, 0, 2 * Math.PI);
        context.fill();
        context.restore();
    }

    canvas.addEventListener('pointerdown', function(event) {
        drawing = true;
        canvas.setPointerCapture(event.pointerId);
        clear(event);
    });
    canvas.addEventListener('pointerup', function() {
        drawing = false;
    });
    canvas.addEventListener('pointercancel', function() {
        drawing = false;
    });
    canvas.addEventListener('pointermove', function(event) {
        if (drawing) clear(event);
    });
});
</script>
<style>
    body {
        background:#eee;
    }
    img, canvas {
        position:absolute;
        top:20px;
        left:50%;
        margin-left:-400px;
        max-width:100%;
        height:auto;
        touch-action:none;
    }
</style>
</head>
<body>
    <img src="gender-reveal-girl.png" width="800" height="600" />
    <canvas id="canvas" width="800" height="600"></canvas>
</body>
</html>
