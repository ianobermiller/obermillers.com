<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Sight Words</title>
<style >

html, body {
  margin:  0;
  padding: 0;
  background-color: #111;
  overflow: hidden;
}

#bar {
  height: 4px;
  background-color: white;
  top: 0;
  left: 0;
  position: fixed;
  transition: width 200ms ease-in;
}

#card {
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui;
  color: white;
}

#word {
  font-size: 20em;
  white-space: nowrap;
  max-width: 100%;
  padding: 0 5vw;
  box-sizing: border-box;
}

#fireworks {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}

#pic {
  display: none;
}

#pic.visible {
  animation: kenburns 20s ease;
  display: block;
}

.shake {
  animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  perspective: 1000px;
}

@keyframes shake {
  10%, 90% {
    transform: translate3d(-0.5%, 0, 0);
  }

  20%, 80% {
    transform: translate3d(1%, 0, 0);
  }

  30%, 50%, 70% {
    transform: translate3d(-1.5%, 0, 0);
  }

  40%, 60% {
    transform: translate3d(1.5%, 0, 0);
  }
}

@keyframes kenburns {
  0% {
    transform-origin: bottom left;
    transform: scale(1.0);
  }
  100% {
    transform: scale(1.2);
  }
}

#settings-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  z-index: 100;
  transition: background 0.2s;
}
#settings-btn:hover {
  background: rgba(255,255,255,0.3);
}

#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
#modal-overlay.open {
  display: flex;
}

#modal {
  background: #222;
  border-radius: 12px;
  padding: 20px;
  max-width: 90vw;
  width: 400px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

#modal h2 {
  margin: 0 0 12px 0;
  color: white;
  font-family: system-ui;
  font-size: 1.25rem;
}

#modal textarea {
  width: 100%;
  min-height: 200px;
  box-sizing: border-box;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #111;
  color: white;
  font-family: system-ui;
  font-size: 14px;
  resize: vertical;
}

#modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

#modal-actions button {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  font-family: system-ui;
  font-size: 14px;
  cursor: pointer;
}

#modal-save {
  background: #2a7;
  color: white;
}
#modal-save:hover { background: #3b8; }

#modal-clear {
  background: #555;
  color: white;
}
#modal-clear:hover { background: #666; }

#modal-close {
  background: transparent;
  color: #999;
}
#modal-close:hover { color: white; }
</style>
</head>
<body>

  <button id="settings-btn" type="button" title="Settings">⚙</button>
  <div id="modal-overlay">
    <div id="modal">
      <h2>Custom sight words</h2>
      <p style="margin:0 0 8px 0; color:#999; font-size:13px;">One word per line or separated by spaces. Save to use your list. Clear and save to use built-in words.</p>
      <textarea id="custom-words" placeholder="cat&#10;dog&#10;run"></textarea>
      <div id="modal-actions">
        <button id="modal-save" type="button">Save</button>
        <button id="modal-clear" type="button">Clear & use built-in</button>
        <button id="modal-close" type="button">Close</button>
      </div>
    </div>
  </div>
  <div id="fireworks"></div>
  <div id="bar"></div>
  <div id="card">
    <div id="word"></div>
    <img id="pic">
  </div>

<script type="module">
import { Fireworks } from 'https://cdn.skypack.dev/fireworks-js@1.2.2';

const words = {
  rhodesK: `also back black could count don’t dream each four from going his home in left made miss name one only out she shop since that there two wants went white wild with`,
  allK: `is like see the to all am an can do look on that this with a about and are as be he has his I is me said she the to was we when you by do for from have her here my of one out or there they were what where will your`,
  reviewK: `from this has his were that when where what`,
  firstQ1: `because know much such which into just most must than them then these those through thank thick shut you your with`,
  firstQ2: `get off small use used went does old year years after before every help part things think who world long put three try two why`,
  firstQ3: `also come some too very away could over number should would between each even great find say says any around down found house how many now our friend other another`,
  reviewSounds: 'ch sh th wh ck',
  sounds: `a b c ch d e f g h i j k l m n o p q r s sh t th u v w x y z`,
  extraPractice: ``,
  rhymingWords: `log mat pat leg`,
  win: `sock`,
  gluedSounds: `bang song hung sing bank pink honk junk`,
};
const wordLists = [
  words.rhodesK,
  // words.reviewK,
  // words.firstQ1,
  // words.firstQ2,
  // words.extraPractice,
  // words.win,
  // words.gluedSounds,
];

const CUSTOM_WORDS_KEY = 'sightwords-custom';

function getCustomWordsFromStorage() {
  try {
    const raw = localStorage.getItem(CUSTOM_WORDS_KEY);
    if (raw == null || raw.trim() === '') return null;
    const list = raw.split(/\s+/).map(s => s.trim()).filter(Boolean);
    return list.length ? list : null;
  } catch (_) {
    return null;
  }
}

const state = {
  index: 0,
  wordArray: [],
  count: 0,
  images: [],
  fireworks: null,
  render: () => {},
};

function init() {
  const salt = Math.random().toString(16).slice(2);
  state.wordArray = getWords();
  state.count = state.wordArray.length;
  state.index = 0;
  state.fireworks = null;

  state.images = [];
  for (let i = 0; i < state.wordArray.length / 5; i++) {
    const image = new Image();
    image.src = `https://place-puppy.com/puppy/y:960/x:1280?random=${salt}${i}`;
    state.images.push(image);
  }

  state.render = function () {
    if (state.index === state.wordArray.length) {
      state.fireworks = state.fireworks || new Fireworks(window.fireworks);
      state.fireworks.start();
      window.word.innerText = '';
      window.bar.style.width = 0;
      window.pic.classList.remove('visible');
      return;
    }

    state.fireworks && state.fireworks.stop();

    if (typeof state.wordArray[state.index] === 'string') {
      window.word.innerText = state.wordArray[state.index].toLowerCase();
      window.word.style.color = `hsl(${360 * state.index / state.count}, 100%, 60%)`;
      fitWord();
      window.pic.classList.remove('visible');
    } else {
      window.word.innerText = '';
      window.pic.src = state.images[state.wordArray[state.index]].src;
      window.pic.classList.add('visible');
    }

    window.bar.style.width = (state.index) / state.count * 100 + '%';
  };

  state.render();
}

function setupInputListeners() {
  document.body.addEventListener('keydown', e => {
    if (document.getElementById('modal-overlay').classList.contains('open')) return;
    switch (e.key) {
      case 'ArrowDown':
      case 's':
        window.card.classList.add('shake');
        setTimeout(() => window.card.classList.remove('shake'), 300);
        return;

      case 'ArrowRight':
      case ' ':
      case 'd':
        state.index++;
        break;

      case 'ArrowLeft':
      case 'a':
        state.index--;
        break;
    }

    if (state.index > state.count) state.index = state.count;
    if (state.index <= 0) state.index = 0;

    state.render();
  });

  document.body.addEventListener('pointerdown', e => {
    if (document.getElementById('modal-overlay').classList.contains('open')) return;
    e.preventDefault();
    const screenWidth = window.innerWidth;
    const pointerX = e.clientX;

    if (pointerX > screenWidth / 2) {
      state.index++;
    } else {
      state.index--;
    }

    if (state.index > state.count) state.index = state.count;
    if (state.index <= 0) state.index = 0;

    state.render();
  });
}

function getWords() {
  const custom = getCustomWordsFromStorage();
  const rawWords = custom ?? wordLists.join(' ').split(' ').map(s => s.trim()).filter(Boolean);
  if (rawWords.length === 0) return [];
  let dogIndex = 0;
  return shuffle([...rawWords]).flatMap(
    (word, i) => i % 5 === 4
      ? [word, dogIndex++]
      : [word]
  );
}

function randomValue(array) {
  const i = Math.floor(Math.random() * array.length);
  return array[i];
}

function fitWord() {
  const wordEl = document.getElementById('word');
  const padding = window.innerWidth * 0.1;
  const maxWidth = window.innerWidth - padding;
  wordEl.style.fontSize = '20em';
  const actualWidth = wordEl.scrollWidth;
  if (actualWidth > maxWidth) {
    wordEl.style.fontSize = (20 * maxWidth / actualWidth) + 'em';
  }
}

function shuffle(array) {
  const copy = array.slice();
  let i = copy.length;

  while (i > 0) {
    const picked = Math.floor(Math.random() * i);
    i--;
    [copy[i], copy[picked]] = [copy[picked], copy[i]];
  }

  return copy;
}

function setupSettings() {
  const overlay = document.getElementById('modal-overlay');
  const textarea = document.getElementById('custom-words');
  const openModal = () => {
    const saved = localStorage.getItem(CUSTOM_WORDS_KEY);
    if (saved != null && saved.trim() !== '') {
      textarea.value = saved;
    } else {
      textarea.value = wordLists.join(' ').split(/\s+/).filter(Boolean).join('\n');
    }
    overlay.classList.add('open');
  };
  const closeModal = () => overlay.classList.remove('open');

  document.getElementById('settings-btn').addEventListener('click', openModal);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  document.getElementById('modal-save').addEventListener('click', () => {
    const value = textarea.value.trim();
    if (value === '') {
      localStorage.removeItem(CUSTOM_WORDS_KEY);
    } else {
      localStorage.setItem(CUSTOM_WORDS_KEY, value);
    }
    closeModal();
    init();
  });

  document.getElementById('modal-clear').addEventListener('click', () => {
    textarea.value = '';
    localStorage.removeItem(CUSTOM_WORDS_KEY);
    closeModal();
    init();
  });
}

setupInputListeners();
setupSettings();
init();
</script>
</body>
</html>
